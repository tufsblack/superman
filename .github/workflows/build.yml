name: Build SupermanPlugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: SupermanPlugin
          path: target/SupermanPlugin.jar
